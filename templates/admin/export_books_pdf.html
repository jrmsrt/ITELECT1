<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            font-size: 12px;
        }

        .header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .logo {
            height: 50px;
            margin-right: 10px;
        }

        .title {
            font-size: 20px;
            font-weight: bold;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #444;
            padding: 6px;
            text-align: left;
            vertical-align: top;
        }

        th {
            background: #666;
            color: #fff;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="header">
    <img src="{{ url_for('static', filename='media/bookhaven-logo.png') }}" class="logo">
    <div>
        <div><strong>BOOKHAVEN</strong></div>
        <div>ONLINE BOOKSTORE</div>
        <div class="title">FULL CATALOG</div>
    </div>
</div>

<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>TITLE</th>
            <th>Author</th>
            <th>Genre</th>
            <th>ISBN</th>
            <th>Price</th>
            <th>Stock</th>
        </tr>
    </thead>
    <tbody>
        {% for book in books %}
        <tr>
            <td>{{ book.id }}</td>
            <td>{{ book.title }}</td>
            <td>{{ book.author }}</td>
            <td>{{ book.genre }}</td>
            <td>{{ book.isbn }}</td>
            <td>₱{{ "{:,.2f}".format(book.price) }}</td>
            <td>{{ book.stock }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

</body>
</html>
